version: 1
evidence:
  - evidence_id: verify-script
    kind: code
    path: verify_certificates.py
    description: >-
      Script canónico de verificación, idéntico byte a byte al archivo auxiliar
      de arXiv. Cada comprobación imprime [PASS] o [FAIL].
  - evidence_id: claims-map
    kind: document
    path: CLAIMS_MAP.md
    description: Correspondencia entre cada enunciado del paper y la comprobación que lo cubre.
  - evidence_id: scenarios
    kind: config
    path: config/simulations/scenarios.yaml
    description: Escenarios default (40 comprobaciones) y full (42 comprobaciones).
  - evidence_id: ci-verify
    kind: workflow
    path: .github/workflows/verify.yml
    description: >-
      Workflow que ejecuta el escenario full con el entorno fijado y publica el
      artefacto verify-output.
  - evidence_id: commuting-module
    kind: code
    path: src/project/commuting.py
    description: >-
      Cálculo exacto de [T_N(Q), T_N(W)] = 0 para N pequeño: reducción, variedad por
      soporte, espacio tangente y control con hard hexagons. Imprime [PASS] o [FAIL].
  - evidence_id: commuting-protocol
    kind: config
    path: config/simulations/commuting-small-n.yaml
    description: Pregunta, método, parámetros y desviaciones del cálculo commuting-small-n.
  - evidence_id: commuting-note
    kind: document
    path: docs/simulations/commuting-small-n.md
    description: Resultados, control positivo, consecuencias y límites.
  - evidence_id: commuting-tests
    kind: code
    path: tests/test_commuting.py
    description: Pruebas de N = 4, 5 (y 6, marcada slow), del tangente y del control.
