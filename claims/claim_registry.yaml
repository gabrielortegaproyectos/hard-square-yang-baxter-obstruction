version: 1
# Claims computacionales de Paper 1. "supported" significa que la comprobación
# correspondiente pasa en el escenario indicado; no reemplaza las pruebas del
# paper, que se leen sin el script. Numeración: borrador del 2026-10-02.
claims:
  - claim_id: binary-certificate
    statement: >-
      Con una cara hard-square pura de factores de esquina no nulos, exactamente
      18 de las 64 ecuaciones de Yang-Baxter binarias son no triviales, y la
      combinación de (3.1)-(3.7) da la identidad (3.8) que fuerza r5 p3 r2 = 0
      (Teorema 3.1). Con pesos no escalonados y rho = 1, la misma combinación que
      en A4 da A^2 D r5 p2 r3 (observación tras el Teorema 3.3).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto binario, ecuación sin factor escalar; Observación 3.2 para el factor escalar.
    limitations: [Comprobación de las identidades algebraicas; la deducción lógica está en el paper.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: near-full-support
    statement: >-
      Las dos ramas tóricas (3.19) y (3.20) satisfacen las 18 ecuaciones y son la
      única solución en cada soporte, comparada con (3.19) y (3.20); el cruce de Gröbner confirma que no hay otros
      conjuntos de ceros de tamaño a lo sumo 2 (Teorema 3.7). Salvo factores de esquina de
      producto 1, las ramas son (cara pura, delta_{b,c}) y (delta_{b,c}, cara pura).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto binario.
    limitations: [El cruce de Gröbner solo corre en el escenario full y no forma parte de la prueba.]
    evidence: [verify-script, scenarios, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: a4-certificate
    statement: >-
      En A4, 36 de las 128 ecuaciones escalonadas son no triviales; G1-G5 son las
      combinaciones indicadas y la identidad (3.17) fuerza r5 p2 r3 = 0 en el tipo 0
      (Teorema 3.3), con simetría bajo el intercambio de tipos.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto A4 con factores rho0, rho1 por tipo.
    limitations: [Comprobación de identidades; la reducción a la forma escalonada es el claim staggered-form.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: staggered-form
    statement: >-
      Construida desde las alturas 1-4 de A4, con P, Q, R arbitrarios tipo por tipo,
      la ecuación (2.2) es el sistema escalonado (2.6) (Lema 2.12). Con cara media
      (s0 Q0, s1 Q1), cada una de las 36 ecuaciones no nulas es s_alpha veces la de
      (2.6) con rho_alpha = rho s_{1-alpha}/s_alpha (Sección 3.2). Las ocho simetrías
      del cuadrado llevan caras hard-square puras escalonadas a caras del mismo tipo
      (observación tras el Teorema 3.3).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto A4.
    limitations: [Aritmética exacta en sympy; las pruebas del lema y de la observación están en el paper.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-29", program_commit: null}
  - claim_id: rsos-calibration
    statement: >-
      Los pesos RSOS críticos de A4 satisfacen la ecuación de Yang-Baxter de caras
      en la convención del paper, y también su forma escalonada (Ejemplo 2.13, Lema 2.12).
    claim_type: methodology
    status: supported
    lifecycle: active
    scope: Cuatro pares (u, v) de parámetros espectrales.
    limitations: [Punto flotante, residuo por debajo de 1e-15; calibra la convención, no prueba un teorema.]
    evidence: [verify-script, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: critical-hard-hexagons
    statement: >-
      Los pesos RSOS críticos de A4 llevados a ocupaciones no dependen del tipo, y en
      u = -lambda dan w6 = 0, w4 w0 = w3 w2 y z = (11 + 5 sqrt 5)/2: presentan hard
      hexagons en su actividad crítica (Ejemplo 2.13).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Familia RSOS crítica del Ejemplo 2.13.
    limitations: [Aritmética exacta en sympy; que la familia cumpla la ecuación de Yang-Baxter sigue siendo la comprobación de punto flotante.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-26", program_commit: null}
  - claim_id: lifts-and-fibre-sums
    statement: >-
      En T2 y T4 hay 7 y 743 configuraciones hard-square y 14 y 1486 homomorfismos
      a P4, con cada fibra una órbita de sigma de tamaño 2 (Ejemplo 2.4(2)); los pesos
      usados en la prueba de la Proposición 2.10 son los indicados; y T1 T0 G1 =
      G1 (C_M Z_M)^2 para M = 4, 6 (Observación 2.11).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Toros T2, T4, T6, T8 y cilindros de circunferencia 4 y 6.
    limitations: [Casos finitos que acompañan pruebas generales del paper.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: blocked-alphabet
    statement: >-
      El alfabeto bloqueado tiene 41 caras admisibles (Sección 4.1) y cumple la
      obstrucción de una ecuación (Teorema 4.1); con pesos también sobre F_V (35 caras)
      la ecuación del Teorema 4.1 no cambia (observación tras el Corolario 4.2).
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Bloques de dos sitios.
    limitations: [Comprobación de conteos e identidades; los argumentos analíticos están en el paper.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  - claim_id: full-binary-certificate
    statement: >-
      En el alfabeto binario con 1~1 (16 caras), con cara media igual a la cara
      hard-square pura en las 7 caras admisibles y 0 en las otras 9, las 12
      ecuaciones de la prueba de la Proposición 4.3 son las indicadas, y
      rho A^2 B C D p2 p4 r3 r4 r5 es la combinación polinomial indicada de ellas.
      Esas ecuaciones sólo usan los ceros de la cara media en cinco caras, y el
      conjunto alternativo de ceros de la observación tras la Proposición 4.3 anula
      exactamente las configuraciones no hard-square en T2, T3 y T4.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto binario con 1~1, pesos auxiliares en las 16 caras.
    limitations: [Comprobación de la identidad; el argumento analítico está en el paper.]
    evidence: [verify-script, claims-map, ci-verify]
    provenance: {paper_draft: "2026-10-26", program_commit: null}
  - claim_id: classification-illustration
    statement: >-
      De los 86 828 alfabetos etiquetados conexos con 2 a 5 alturas, con alturas
      ocupadas y vacías y sin alturas ocupadas adyacentes, sobreviven exactamente dos
      clases de isomorfía al filtro de preimágenes en el toro 4x4; comparadas por
      isomorfía, con la ocupación, son el binario y A4.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabetos con a lo sumo cinco alturas; escenario full.
    limitations: [Ilustra la Proposición 2.5, que se prueba en el texto; no es parte de la prueba.]
    evidence: [verify-script, scenarios, ci-verify]
    provenance: {paper_draft: "2026-10-02", program_commit: 7d9d37e}
  # Cálculos exploratorios, fuera del paper (issue #1). No están en el archivo auxiliar
  # de arXiv; pasan al manuscrito solo después de que el autor los revise.
  - claim_id: commuting-small-n
    statement: >-
      Para N = 4, 5, 6 y 7 y todo z != 0, una cara binaria W con pesos en las siete
      caras admisibles y T_N(W) != 0 tiene [T_N(Q), T_N(W)] = 0, con Q una cara
      hard-square pura de actividad z, si y solo si T_N(W) es múltiplo de T_N(Q), del
      desplazamiento S o de su inverso. Para N = 5, 6, 7 las tres soluciones son puntos
      reducidos salvo escala y gauges de esquina; para N = 4, Q es un punto doble. Para
      N = 2 y 3 hay componentes de dimensión 2.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto binario, siete pesos admisibles, N <= 7; z simbólico.
    limitations:
      - No cubre pesos en las caras de par vertical ni en las caras con un par horizontal, alturas ocultas, bloques ni A4.
      - N = 7 corre solo con --long; bases de Gröbner de sympy, sin cruce con otro sistema.
      - No es un resultado del paper; no afirma no-integrabilidad absoluta.
    evidence: [commuting-module, commuting-protocol, commuting-note, commuting-tests]
    provenance: {paper_draft: "J. Phys. A, PR #54, Sección 5.2", issue: 1}
  - claim_id: commuting-tangent
    statement: >-
      El espacio tangente en Q a {W : [T_N(Q), T_N(W)] = 0} está generado por la escala y
      los dos gauges de esquina para todo z != 0 con N = 5 y 6 (factores invariantes
      1, 1, z^2, z^2 sobre Q[z]), y para 5 <= N <= 12 en z = 2, -1, 1/3, -1/4 y 7/5. Con
      N = 4 tiene una dirección más, que no se integra.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto binario, siete pesos admisibles.
    limitations: [Para N >= 7 solo en cinco valores de z; N de 10 a 12 solo con --long.]
    evidence: [commuting-module, commuting-note, commuting-tests]
    provenance: {paper_draft: "J. Phys. A, PR #54, Sección 5.2", issue: 1}
  - claim_id: commuting-control-hard-hexagons
    statement: >-
      Con la cara de hard hexagons a z = 2, el mismo cálculo encuentra para N = 4, 5 y 6
      una misma curva de caras cuyas matrices conmutan con la suya, contenida en la
      superficie de Baxter F(z,X,Y) = 0. El método detecta una familia que conmuta cuando
      existe.
    claim_type: methodology
    status: supported
    lifecycle: active
    scope: Control positivo del cálculo commuting-small-n.
    limitations: [Un valor de z; N = 6 solo con --long.]
    evidence: [commuting-module, commuting-note, commuting-tests]
    provenance: {issue: 1}
  - claim_id: commuting-crosscheck
    statement: >-
      Una implementación independiente coincide con commuting-small-n para N = 4, 5 y 6 en
      z = 3, -2/7 y 5/2: solo las clases de T_N(Q0), S y S^-1, Q0 doble con N = 4 y puntos
      reducidos desde N = 5, y el mismo rango del jacobiano en Q0. Usa ecuaciones del
      producto explícito de matrices, otro corte de gauge, bases grevlex con F5B y
      clasificación de T_N(W) en cada punto.
    claim_type: methodology
    status: supported
    lifecycle: active
    scope: Alfabeto binario, siete pesos admisibles.
    limitations: [Mismo sistema de álgebra computacional (sympy); actividades fijas, no z simbólico.]
    evidence: [commuting-crosscheck-module, commuting-note, commuting-tests]
    provenance: {issue: 1}
  - claim_id: commuting-a4-local
    statement: >-
      En el alfabeto A_4, sea Q una presentación de hard squares con actividad z no nula.
      Para circunferencia M = 6 y 8 (y 10 con --long), a z = 2, -1, 1/3, -1/4 y 7/5, y para
      todo z no nulo con M = 6, el espacio tangente en Q del conjunto de
      caras W con [T_M(Q), T_M(W)] = 0 es el de las seis simetrías triviales. Por eso
      ninguna familia analítica de caras de A_4 que pase por Q tiene matrices de
      transferencia que conmuten con T_M(Q), salvo las proporcionales a T_M(Q). Con M = 4
      hay una dirección más. Control: con hard hexagons en ambos tipos hay una dirección más,
      no escalonada.
    claim_type: finding
    status: supported
    lifecycle: active
    scope: Alfabeto A_4, cerca de una presentación de hard squares.
    limitations: [Solo local: no clasifica los compañeros lejos de Q.]
    evidence: [commuting-a4-module, commuting-note, commuting-tests]
    provenance: {issue: 1}
