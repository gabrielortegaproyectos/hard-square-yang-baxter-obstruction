[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-square-yang-baxter-obstruction"
version = "0.9.0"
description = "Exact computations for 'A local Yang-Baxter obstruction for the hard-square model'."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Ortega" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6,<7",
    "sympy>=1.12",
    "networkx>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the --groebner and --classify cross-checks"]
